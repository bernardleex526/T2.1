# ============================================================================
# lio_c2_experimental.yaml - OPT-IN profile for the C2 frontend-drift ablation
# ============================================================================
# NOT A FIX, NOT A DEFAULT. This file exists only so the C2 ablation
# (04b73f5_controlled_ab_20260929/c2_frontend_attribution.json) can be run without
# touching config/lio.yaml. The hypotheses below have NEVER been measured: the C2
# replays were not executed (0 replays; the attribution table is a static factor
# list, not a result), so nothing here may be described as a proven improvement,
# quoted as a deployment value, or enabled by default.
#
# Content: byte-for-byte the legacy config/lio.yaml, plus exactly the four C2 keys.
# For a single-factor arm (C2.1, C2.2 or C2.3 alone) delete the other keys from a copy.
#
# Flat top-level keys only; lio_node resolves no aliases and no nested `imu:` block.
#   imu_acc_normalize: C2.1, upstream FAST-LIO2 rescales every averaged accel sample by
#     9.81/|mean accel of the init window| (imu_processor.cpp). Legacy default = false.
#   imu_init_mode: C2.2. "first_batch" = initialise from the whole first IMU batch with no
#     static verdict and no wait (upstream behaviour); "static_window" = legacy default.
#   imu_init_min_samples: samples required by first_batch before it is ready.
#   pcl2_filter_phase: C2.3, the decimation phase of Utils::pcl2_to_PCL (PointCloud2 path only;
#     it is inert on the default `lidar_type: livox` profile, which uses livox2PCL and has no
#     phase parameter). 0 = upstream `i % point_filter_num == 0`; 1 = the complementary residue
#     class. Legacy default = 0.
# ============================================================================
imu_topic: /livox/imu
lidar_topic: /livox/lidar
body_frame: body
world_frame: odom
print_time_cost: false

lidar_filter_num: 2
lidar_min_range: 0.5
lidar_max_range: 30.0
scan_resolution: 0.15
map_resolution: 0.3

cube_len: 1000
det_range: 100
move_thresh: 1.5

na: 0.06
ng: 0.005
nba: 0.00008
nbg: 0.000003

imu_init_num: 100
imu_init_window_s: 3.0
imu_init_static_gyro_std: 0.005
imu_init_static_acc_dev: 0.3
imu_init_max_wait_s: 5.0
# --- C2 ablation switches (experimental; see the header) ---
imu_acc_normalize: true
imu_init_mode: "first_batch"
imu_init_min_samples: 40
pcl2_filter_phase: 1         # C2.3, PointCloud2 path only (no-op for lidar_type: livox below)
near_search_num: 5
ieskf_max_iter: 5

gravity_align: true
esti_il: false

# 雷达/IMU 适配（迁移到其他机器人时修改这里）
# lidar_type: "livox" 表示订阅 livox CustomMsg；"pointcloud2" 表示订阅通用 PointCloud2(Velodyne/Ouster/RoboSense 等)
lidar_type: livox
lidar_max_line: 4            # Livox 扫描线数(MID360=4)；非 Livox 或 CustomMsg 模式可忽略
imu_acc_scale: 10.0          # MID360 内置 IMU 设 10.0(其输出约为 g，×10≈m/s²)；标准 IMU 输出 m/s² 时设 1.0
# pointcloud2 模式下每点时间字段(为空则不做扫描内运动补偿)。Velodyne 用 "time"(scale=1.0)；Ouster 用 "t"(scale=1e-9，绝对时间，需改相对)
pcl2_time_field: ""
pcl2_time_scale: 1.0

point_quality_thresh: 0.9    # 上游 FAST-LIO2 的 s>0.9 残差门限；稀疏处无有效点时由 IESKF 降级路径处理

ext_il: [-0.011, -0.02329, 0.04412, 0.0, 0.0, 0.0, 1.0] # x y z qx qy qz qw
ext_lc:
  [
    0.055301417087128005,
    -0.023940681099107203,
    -0.036510243108364156,
    0.5040772962309031,
    -0.5018066026651014,
    0.49854633904149553,
    -0.4955277598425481,
  ] # x y z qx qy qz qw

cam_width: 1280
cam_height: 720
cam_fx: 641.976318359375
cam_fy: 641.0658569335938
cam_cx: 641.5721435546875
cam_cy: 368.21832275390625
cam_d: [-0.05588280409574509, 0.06619580090045929, 0.0002959131670650095, 0.0008284428040497005, -0.021595485508441925]

lidar_cov_inv: 1000.0
