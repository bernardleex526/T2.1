# ============================================================================
# odin1.yaml - Deployment profile for RoboSense Odin1 on Quadruped platform
# ============================================================================
imu_topic: /imu/data
lidar_topic: /rslidar_points
body_frame: body
world_frame: odom
print_time_cost: false

# --- front-end input / preprocess ---
lidar_type: pointcloud2
lidar_max_line: 4
lidar_filter_num: 2
lidar_min_range: 0.4
lidar_max_range: 50.0

# RoboSense Odin1 per-point time field (XYZIRT layout)
pcl2_time_field: "timestamp"
pcl2_time_scale: 1.0e-9
imu_acc_scale: 1.0

# --- high-precision mapping voxels for <= 5cm accuracy target ---
scan_resolution: 0.05
map_resolution: 0.05
cube_len: 500.0
det_range: 60.0
move_thresh: 1.5

# --- noise parameters (Allan variance calibrated) ---
na: 0.1
ng: 0.02
nba: 0.0001
nbg: 0.00001

# --- IMU initialization (static window) ---
imu_init_num: 40
imu_init_window_s: 3.0
imu_init_static_gyro_std: 0.005
imu_init_static_acc_dev: 0.3
imu_init_max_wait_s: 5.0

near_search_num: 5
ieskf_max_iter: 5
gravity_align: true
esti_il: false
point_quality_thresh: 0.9

# --- extrinsic LiDAR to IMU [x y z qx qy qz qw] ---
ext_il: [-0.011, -0.02329, 0.04412, 0.0, 0.0, 0.0, 1.0]

lidar_cov_inv: 1000.0

# --- quadruped gait motion compensation ---
gait_filter_enable: true
gait_notch_freq_hz: [18.5, 37.0]
gait_notch_q: 12.0
gait_filter_sample_rate_hz: 200.0
gait_filter_gyro_x: true
gait_filter_gyro_y: true
gait_filter_gyro_z: false
gait_filter_accel_x: true
gait_filter_accel_y: true
gait_filter_accel_z: false
