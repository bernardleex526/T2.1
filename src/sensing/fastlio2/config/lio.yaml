imu_topic: /livox/imu
lidar_topic: /livox/lidar
body_frame: body
world_frame: odom
print_time_cost: false

lidar_filter_num: 2
lidar_min_range: 0.5
lidar_max_range: 30.0
scan_resolution: 0.15
map_resolution: 0.3

cube_len: 1000
det_range: 40
move_thresh: 1.5

na: 0.06
ng: 0.005
nba: 0.00008
nbg: 0.000003

imu_init_num: 100
imu_init_window_s: 3.0
imu_init_static_gyro_std: 0.005
imu_init_static_acc_dev: 0.3
imu_init_max_wait_s: 5.0
near_search_num: 5
ieskf_max_iter: 5

gravity_align: true
esti_il: false

# 雷达/IMU 适配（迁移到其他机器人时修改这里）
# lidar_type: "livox" 表示订阅 livox CustomMsg；"pointcloud2" 表示订阅通用 PointCloud2(Velodyne/Ouster/RoboSense 等)
lidar_type: livox
lidar_max_line: 4            # Livox 扫描线数(MID360=4)；非 Livox 或 CustomMsg 模式可忽略
imu_acc_scale: 10.0          # MID360 内置 IMU 设 10.0(其输出约为 g，×10≈m/s²)；标准 IMU 输出 m/s² 时设 1.0
# pointcloud2 模式下每点时间字段(为空则不做扫描内运动补偿)。Velodyne 用 "time"(scale=1.0)；Ouster 用 "t"(scale=1e-9，绝对时间，需改相对)
pcl2_time_field: ""
pcl2_time_scale: 1.0

point_quality_thresh: 0.9    # 上游 FAST-LIO2 的 s>0.9 残差门限；稀疏处无有效点时由 IESKF 降级路径处理

ext_il: [-0.011, -0.02329, 0.04412, 0.0, 0.0, 0.0, 1.0] # x y z qx qy qz qw
