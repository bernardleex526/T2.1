# ============================================================================
# airy.yaml - RoboSense Airy on the quadruped, Orin NX (default config_file of universe/sensing launch)
# ============================================================================
# STATUS: NOT READY until the three MEASURE-ON-ROBOT items below are filled in.
#   python3 tools/preflight_config.py --config src/sensing/fastlio2/config/airy.yaml
# refuses this file as shipped (exit 2) - on purpose.  Nothing here was measured on the target
# robot; an earlier revision carried a MID360 extrinsic, a nanosecond time scale on a seconds field
# and an unsourced 18.5/37 Hz gait notch, which made the map 3x worse (4.2 cm RMSE) or crashed.
#
# Values that ARE justified (Gazebo T2.1 regression, 96-line 360-deg lidar at ~310k pts/s, quadruped
# body motion +-5 deg pitch, 0.5-1.0 m/s): with the true extrinsic this file gives map RMSE
# 1.2-1.8 cm, p95 <= 4.0 cm, odometry ATE <= 2.8 cm.  The Gazebo lidar renders a scan instantly,
# so in-scan de-skew is NOT exercised there.
# Flat schema read by lio_node.cpp loadParameters().
# ============================================================================
imu_topic: /imu/data
lidar_topic: /rslidar_points
body_frame: body            # = the IMU frame; the URDF root (quadruped_description) hangs base_link off it
world_frame: odom
print_time_cost: false

# --- front-end input / preprocess ---
lidar_type: pointcloud2
lidar_filter_num: 2
lidar_min_range: 0.3        # Airy blind zone 0.1 m; 0.3 also drops returns from the robot's own legs
lidar_max_range: 60.0       # Airy 0.1-100 m; beyond ~60 m indoor/campus returns are sparse and noisy
# rslidar_sdk POINT_TYPE=XYZIRT publishes `timestamp` as FLOAT64 ABSOLUTE SECONDS -> scale 1.0.
# lio_node takes the scan start from the earliest point time, so the driver's ts_first_point
# setting does not matter.  The SDK default POINT_TYPE=XYZI has NO per-point time: rebuild the
# driver with XYZIRT.  Confirm on the robot: python3 tools/rslidar_pcl2_probe.py --topic /rslidar_points --once
pcl2_time_field: "timestamp"
pcl2_time_scale: 1.0
imu_acc_scale: 1.0          # verify: static mean |a| ~ 9.81 m/s^2 (tools/odom_static_drift.py)

# --- mapping / IESKF ---
# 0.15 m scan voxel keeps ~6k points per scan (Orin NX real-time margin); 0.15 m map voxel was
# measured at 1.2-1.8 cm map RMSE in the Gazebo regression.  Do not go below 0.1 m on Orin NX
# without measuring the per-scan time (print_time_cost: true, must stay < 100 ms).
scan_resolution: 0.15
map_resolution: 0.15
cube_len: 500.0
det_range: 60.0
move_thresh: 1.5

# --- MEASURE ON ROBOT (1/3): IMU noise, from a >=2 h static recording ---
#   python3 tools/imu_allan_variance.py --bag imu_static --topic /imu/data --emit-yaml
# na: <m/s^2/sqrt(Hz)>   ng: <rad/s/sqrt(Hz)>   nba: <..>   nbg: <..>

# --- IMU initialization (static window) ---
imu_init_num: 40
imu_init_window_s: 3.0
imu_init_static_gyro_std: 0.005
imu_init_static_acc_dev: 0.3
imu_init_max_wait_s: 5.0
imu_lpf_enable: false       # see commons.h: the accel-only LPF delays accel vs gyro

near_search_num: 5
ieskf_max_iter: 5
gravity_align: true
esti_il: false
point_quality_thresh: 0.9

# --- MEASURE ON ROBOT (2/3): LiDAR -> IMU extrinsic [x y z qx qy qz qw], p_imu = R*p_lidar + t ---
# Must equal T_imu<-lidar implied by the imu_* / lidar_* mount args of quadruped_description.
# ext_il: [<x>, <y>, <z>, <qx>, <qy>, <qz>, <qw>]

lidar_cov_inv: 1000.0

# --- MEASURE ON ROBOT (3/3, optional): gait notch ---
# Gait pitch/roll is REAL body rotation the lidar undergoes; do not notch it out.  Only notch a
# measured STRUCTURAL resonance (tools/imu_gait_spectrum.py on a walking recording), and keep the
# gyro and accel masks equal so both triples get the same group delay.
gait_filter_enable: false
gait_filter_sample_rate_hz: 200.0
