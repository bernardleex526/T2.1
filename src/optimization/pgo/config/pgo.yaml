cloud_topic: /mapping/body_cloud
odom_topic: /mapping/lio_odom
map_frame: map
local_frame: odom

key_pose_delta_deg: 10
key_pose_delta_trans: 0.5

# ===========================================================================
# STEP 1+2 loop-closure front end
#
#   Scan Context global descriptor retrieval  ->  coarse registration seeded with
#   the descriptor's relative yaw (fast_gicp)  ->  fine point-to-plane ICP  ->
#   multi-gate acceptance (fitness, overlap ratio, eigenvalue degeneracy).
#
# Every candidate that reaches the registration stage is logged as one
# `[PGO][gate]` line carrying the value of every gate, and every detection event
# as one `[PGO][sc]` line carrying the run totals and the per-stage timings.
# ===========================================================================

# ---- which detectors propose candidates -----------------------------------------------
loop_enable_scan_context: true    # Scan Context descriptor retrieval. NOT bounded by
                                  # loop_search_radius: it must find revisits whose drifted
                                  # keyframe positions are far apart (that was the D3 failure).
loop_enable_radius_search: true   # Legacy Euclidean radius search over keyframe positions,
                                  # kept as a fallback/complement. Its candidates carry no
                                  # yaw prior - a drifted position has no usable relative yaw -
                                  # so they enter the cascade with an identity initial guess.
loop_search_radius: 8.0           # radius-search bound [m]; must exceed the accumulated drift
                                  # (observed 5.80 m over a 134.15 m path on
                                  # mid360s_office_loop_01) or real loops are never proposed.
loop_time_tresh: 60.0             # temporal separation guard [s]: a candidate keyframe must
                                  # be at least this far from the current one.
min_loop_detect_duration: 5.0     # rate limit [s] between two detection events; bounds the
                                  # cost of the cascade (each event runs up to
                                  # max_loop_candidates_per_query registrations).

max_loop_candidates_per_query: 3  # registrations attempted per detection event, best
                                  # descriptor distance first.
max_accepted_loops_per_query: 1   # loop factors added per detection event.
loop_source_submap_half_range: 0  # source cloud = the current keyframe alone (0) or a local
                                  # map around it.
loop_submap_half_range: 5         # target cloud = +-5 keyframes around the candidate
                                  # (measured in keyframes, each keyframe is ~0.5 m apart).
submap_resolution: 0.1            # VoxelGrid applied when building the submaps [m].

# ---- Scan Context descriptor ---------------------------------------------------------
# Geometry defaults are the IROS 2018 paper values used by SC-LIO-SAM / SC-FAST-LIO.
sc_num_ring: 20                   # radial bins
sc_num_sector: 60                 # azimuth bins -> the returned yaw is quantised to
                                  # 360/60 = 6 deg. That is fine: the coarse stage only has
                                  # to land inside a 3 m correspondence radius (6 deg at a
                                  # 20 m lever arm is 2.1 m).
sc_max_radius: 80.0               # points beyond this radius are dropped from the descriptor [m]
sc_lidar_height: 2.0              # constant added to z before the per-bin max (upstream default;
                                  # it cancels out of the argmax, so it does not change the
                                  # descriptor)
sc_downsample_resolution: 0.2     # VoxelGrid on the keyframe body cloud before describing it [m]
sc_dist_thresh: 0.30              # maximum Scan Context cosine distance for a candidate.
                                  # Upstream: 0.1-0.2 is the false-alarm-free range when there is
                                  # NO downstream ICP check; 0.3-0.6 is what SC-LIO-SAM uses when
                                  # there IS one. This pipeline has a full registration cascade
                                  # plus three gates behind it, so the loose 0.30 is used and the
                                  # gates do the rejecting (a rejected candidate is logged, so the
                                  # descriptor's own precision is measurable from the log).
sc_num_candidates: 3              # ringkey nearest neighbours re-ranked per query
sc_exclude_recent: 30             # never propose one of the last N keyframes (~15 m)

# ---- stage A: coarse registration (fast_gicp), seeded with the descriptor yaw ---------
coarse_voxel_resolution: 0.5      # [m]
coarse_max_corr_dist: 3.0         # [m] correspondence radius. Must exceed the residual
                                  # misalignment left by the 6 deg descriptor yaw quantum at
                                  # the scene's range: 6 deg at 20 m is 2.1 m, so 3.0 m is the
                                  # practical floor.
coarse_max_iterations: 64
coarse_max_rmse: 1.5              # [m] GROSS-FAILURE bound on the coarse stage: sqrt() of the
                                  # PCL fitness score, i.e. the RMS nearest-neighbour distance
                                  # over ALL source points (PCL's score is a mean SQUARED
                                  # distance) - that is the interpretable form; the legacy
                                  # loop_score_tresh = 0.15 was 0.387 m RMS.
                                  # Basis: measured on this sequence, the candidates that are
                                  # genuinely co-located (large overlap, small plane residual)
                                  # have a coarse RMS of 0.86-0.93 m, because a rotating
                                  # LiDAR sees a different field of view at the two visits and
                                  # the uncovered geometry sits in this mean. Everything above
                                  # ~2 m is a gross misalignment, so 1.5 m keeps a 1.6x margin
                                  # above the genuine pairs and still cuts ~2/3 of the
                                  # candidates before the expensive fine stage.

# ---- stage B: fine registration (point-to-plane ICP) ---------------------------------
fine_voxel_resolution: 0.10       # [m]
fine_max_corr_dist: 0.50          # [m]
fine_max_iterations: 60
# Two acceptance residuals, both in metres (PCL's fitness score is a mean SQUARED distance, so
# its square root is an RMS distance - that is the interpretable form; the legacy single gate
# loop_score_tresh = 0.15 was 0.387 m RMS, i.e. it admitted a 39 cm RMS mismatch):
fine_max_rmse: 1.5                # [m] over ALL source points. Loose BY DESIGN: source points
                                  # whose geometry the target submap does not contain (a
                                  # different field of view, unavoidable when the platform
                                  # rotated between the two visits) are expected and dominate
                                  # this mean. Measured: 0.15-0.45 m for the co-located pairs of
                                  # a stationary rotating platform, 0.96-1.03 m for the genuine
                                  # long-loop revisits. It therefore cannot discriminate and is
                                  # kept only as a gross-failure bound.
fine_max_plane_rmse: 0.05         # [m] point-to-plane RMS over the correspondences inside
                                  # overlap_radius: "how far off the surfaces are where the two
                                  # scans do overlap". This is the discriminating residual.
                                  # Basis: measured on this sequence, candidates whose
                                  # registration is corroborated by a high overlap ratio land
                                  # at 0.012-0.037 m, while the distribution over all
                                  # candidates that reach the fine stage has a median of
                                  # 0.042 m and a maximum of 0.056 m; 0.05 keeps a 1.4x margin
                                  # above the worst corroborated candidate.
fine_normal_search_radius: 0.30   # [m] normal estimation radius used by the point-to-plane
                                  # stage and by the degeneracy gate; ~100 neighbours per point
                                  # at fine_voxel_resolution, which is enough for an indoor plane.
correspondence_randomness: 10     # fast_gicp knn used to estimate the per-point covariances

# ---- acceptance gates ----------------------------------------------------------------
# A wrong loop with the D2 noise model (sigma 1 cm, stiffer than the accumulated odometry
# random walk it is meant to remove) actively damages the graph, so every gate is set to
# reject a doubtful loop rather than admit it.
overlap_radius: 0.10              # [m] correspondence radius for the overlap ratio
min_overlap_ratio: 0.40           # Minimum fraction of source points that must have a target
                                  # point within overlap_radius after registration.
                                  # Basis: this is the strongest discriminator measured on this
                                  # sequence. Candidates whose registration is corroborated by
                                  # the other gates reach 0.43-0.81; the distribution over all
                                  # candidates that reach the fine stage has a median of 0.25.
                                  # 0.40 keeps a 1.08x margin above the weakest genuine
                                  # revisit and cuts ~60% of the candidates.
overlap_radius_2: 0.20            # diagnostic only (never gated), logged as a second
overlap_radius_3: 0.50            # and third overlap number to show the tolerance curve
degeneracy_gate_enabled: true
degeneracy_min_eig_ratio: 0.003   # Reject when lambda_min/lambda_max of
                                  # H = sum_i n_i n_i^T over the in-radius correspondences falls
                                  # below this. H is the information matrix of the point-to-plane
                                  # residual: an eigenvalue near zero means the geometry does
                                  # not constrain that direction at all (a corridor, where both
                                  # walls' normals are perpendicular to the corridor axis, so
                                  # sliding along it is free) and the registration there is the
                                  # initial guess rather than a measurement - applying the loop's
                                  # 1 cm sigma to it would be a false certainty.
                                  # Basis: 0.003 is a RANK-DEFICIENCY threshold, not a
                                  # precision threshold. Measured on this sequence, the
                                  # genuinely co-located corridor revisits have lambda_min/
                                  # lambda_max = 0.0066-0.025 (corridors really are
                                  # weakly-constrained in this sense), so any larger threshold
                                  # would reject true loops; see the report for the full
                                  # distribution and for the synthetic check that the statistic
                                  # does go to ~0 for a truly unconstrained direction.

max_loop_correction: 2.0          # [m] Plausibility bound on the CORRECTION a candidate
                                  # demands. Perception is aliased: an office corridor repeats
                                  # every few metres, so the descriptor happily matched two
                                  # keyframes 16-19 m apart whose clouds really do overlap
                                  # (measured on this sequence: overlap 0.55-0.57, plane RMS
                                  # 0.029-0.038 m) while the odometry says the platform was 16-19 m
                                  # away - i.e. those matches demand more drift correction than
                                  # the trajectory ever accumulated anywhere (its end-of-loop
                                  # drift is 5.87 m over 134 m). Rejecting them is the
                                  # "prefer a missed loop over a wrong one" rule applied to the
                                  # one failure mode the geometric gates cannot see.
                                  # Basis: the genuine revisit of this sequence disagrees with
                                  # the odometry by only 0.16 m (the drift is a smooth
                                  # deformation: two keyframes that are physically co-located are
                                  # moved by nearly the same amount), while every aliased match
                                  # that reached this gate demanded 1.3-25 m. 2.0 m is 12x the
                                  # measured genuine value and below the smallest measured alias
                                  # that actually damaged the graph (5.6 m, run step12-B2).
                                  # SET THIS from your own platform's drift behaviour.

max_yaw_disagreement: 15.0        # [deg] scan-context candidates only (a radius-search
                                  # candidate has no descriptor yaw): |descriptor relative yaw -
                                  # odometry relative yaw|, i.e. a consistency check between two
                                  # INDEPENDENT yaw estimates of the same relative pose. They
                                  # agree up to the yaw drift accumulated between the two visits
                                  # (~1 deg on this office loop); a perceptual alias has an
                                  # arbitrary relative yaw. Measured: the genuine revisit
                                  # disagrees by 0.9 deg, the aliased candidates that the
                                  # geometric gates admitted by 18-171 deg.
                                  # ASSUMPTION: your odometry's yaw drift stays below this.

# ===== D2 fix: loop-closure noise model =====
# Standard deviations (SI units) of the loop-closure BetweenFactor. The old code used
# `Variances(Vector6::Ones() * pair.score)` (the raw ICP fitness, <= loop_score_tresh=0.15),
# i.e. variances up to 0.15 against odometry variances of 1e-6, so every loop factor was
# 1e4..1e5x weaker than odometry and ISAM2 effectively ignored all of them.
# Defaults below: sigma_xyz = 1 cm (variance 1e-4) and sigma_rpy = 0.005 rad (variance 2.5e-5).
# Relative weight vs the odometry BetweenFactor variances (1e-6,1e-6,1e-6,1e-4,1e-4,1e-6):
#   - vs ONE odometry factor: equal in x/y variance (1e-4 vs 1e-4), 100x weaker in z
#     (1e-4 vs 1e-6) and 25x weaker in rotation (2.5e-5 vs 1e-6);
#   - vs the ~N=300 odometry factors that a loop spans: a chain of N factors has N times the
#     variance, N*1e-4 = 3e-2 m^2 in x/y and N*1e-6 = 3e-4 m^2 in z, i.e. far softer than the
#     loop factor (1e-4 / 2.5e-5). The loop therefore out-votes the accumulated random walk and
#     actually pulls the graph closed, while one grossly wrong loop cannot wreck it (Huber).
# NOTE (STEP 1+2): the front end now rejects doubtful loops BEFORE they reach the graph
# (overlap + degeneracy + fine fitness), so this aggressive variance no longer has to absorb a
# wrong constraint - it only has to out-vote the drift. The Huber kernel is kept as the second
# line of defence; see the report for whether it is still needed at the same strength.
loop_noise_xyz: 0.01
loop_noise_rpy: 0.005
# Huber threshold in whitened units (multiples of the loop sigma); residuals above it are
# down-weighted as k/|r|, so gross ICP failures get a small weight instead of a huge error.
# Setting this to 0 disables the robust kernel entirely (plain Gaussian on the loop factor).
# STEP 1+2 note: with the front end now deciding admission, this kernel no longer has to
# absorb a wrong constraint - but it DOES still down-weight a CORRECT loop that has to remove
# a large drift, because the residual of a correct loop is large until the graph has moved.
# Measured on this sequence, see the report: that pathology is why this was measured both
# ways. 3.0 = the inherited D2 default; 0.0 = plain Gaussian.
loop_robust_k: 3.0
