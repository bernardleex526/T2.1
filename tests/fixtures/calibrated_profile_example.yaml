# A calibrated profile, used to prove preflight_config.py accepts a good config
# and rejects each individual defect.  The values are synthetic test values, NOT
# measurements from any real robot.
imu_topic: /imu/data
lidar_topic: /rslidar_points
body_frame: body
world_frame: odom
print_time_cost: false

lidar_type: pointcloud2
lidar_max_line: 4
lidar_filter_num: 2
lidar_min_range: 0.5
lidar_max_range: 30.0

pcl2_time_field: "timestamp"
pcl2_time_scale: 1.0e-9
imu_acc_scale: 1.0

scan_resolution: 0.3
map_resolution: 0.3
cube_len: 200.0
det_range: 30.0
move_thresh: 1.5

na: 0.06
ng: 0.005
nba: 8.0e-5
nbg: 3.0e-6

imu_init_num: 40
imu_init_window_s: 3.0
imu_init_static_gyro_std: 0.005
imu_init_static_acc_dev: 0.3
imu_init_max_wait_s: 5.0

near_search_num: 5
ieskf_max_iter: 5
gravity_align: true
esti_il: false
point_quality_thresh: 0.9

ext_il: [-0.011, -0.02329, 0.04412, 0.0, 0.0, 0.0, 1.0]

lidar_cov_inv: 1000.0

gait_filter_enable: true
gait_notch_freq_hz: [18.5, 37.0]
gait_notch_q: 12.0
gait_filter_sample_rate_hz: 200.0
gait_filter_gyro_x: true
gait_filter_gyro_y: true
gait_filter_gyro_z: false
gait_filter_accel_x: true
gait_filter_accel_y: true
gait_filter_accel_z: false
